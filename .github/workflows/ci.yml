name: Tests

# Runs on ordinary pushes so breakage is caught before you tag a release,
# rather than by the release build failing halfway through.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Behaviour tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # These drive a real Electron window, so they need a virtual display.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Two separate problems, in order.
      #
      # npm no longer runs package install scripts by default, so electron's
      # postinstall never fires and node_modules/electron/dist does not exist
      # after npm ci -- the binary is fetched lazily on first launch instead.
      # Fetch it up front so there is something to fix the permissions on.
      #
      # Then: the SUID sandbox helper arrives without the ownership it needs, and
      # Electron aborts rather than quietly run unsandboxed. Correcting the
      # permissions keeps these tests on the same sandbox setting the app ships
      # with, which passing --no-sandbox would not.
      - name: Fetch Electron and let its sandbox run
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Overlay smoke test
        run: npm run test:overlay

      - name: Drag tracks the cursor without running away
        run: npm run test:drag
