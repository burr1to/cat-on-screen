name: Tests

# Runs on ordinary pushes so breakage is caught before you tag a release,
# rather than by the release build failing halfway through.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Behaviour tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # These drive a real Electron window, so they need a virtual display.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Electron's SUID sandbox helper ships without the ownership it needs, and
      # Electron refuses to run unsandboxed rather than quietly weakening itself.
      # Fixing the permissions keeps the tests running the same sandbox setting
      # the app actually ships with, which disabling the sandbox would not.
      - name: Let Electron's sandbox run on the runner
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Overlay smoke test
        run: npm run test:overlay

      - name: Drag tracks the cursor without running away
        run: npm run test:drag
