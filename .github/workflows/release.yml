name: Release

# Pushing a version tag builds the selected platforms and publishes a GitHub
# release with the binaries attached. Nothing is released without a tag, so
# ordinary pushes to main stay harmless.
on:
  push:
    tags:
      - "v*"
  # Lets you rebuild and re-attach binaries for a tag that already exists,
  # without having to delete and re-push the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  targets:
    name: Select release targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Select platforms for this tag
        id: targets
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ "$TAG" = "v0.2.1" ]; then
            echo 'matrix={"include":[{"os":"windows-latest","label":"Windows x64","script":"dist:windows"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"windows-latest","label":"Windows x64","script":"dist:windows"},{"os":"ubuntu-latest","label":"Linux x86_64","script":"dist:linux"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: targets
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the other one built.
      fail-fast: false
      # v0.2.1 is deliberately Windows-only. Later ordinary version tags keep
      # the normal two-platform matrix selected by the targets job above.
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag should not be able to ship a build whose behaviour tests fail.
      - name: Behaviour tests
        run: npm test

      - name: Fetch Electron for the native Windows smoke test
        if: matrix.os == 'windows-latest'
        run: node node_modules/electron/install.js

      - name: Native Windows overlay smoke test
        if: matrix.os == 'windows-latest'
        run: npm run test:windows-overlay-native

      # --publish never matters: electron-builder infers a GitHub publish target
      # from the git remote and would try to create its own release, colliding
      # with the publish job below. Building and publishing stay separate.
      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: kairo-${{ matrix.os }}
          # latest*.yml is what installed copies poll to discover a new version,
          # and the blockmaps let Windows download only the changed parts. Ship
          # the binaries without these and auto-update silently never fires.
          # Narrower than *.yml on purpose: builder-debug.yml is not for users.
          path: |
            release/*.exe
            release/*.AppImage
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -lh dist

          # Re-running for an existing tag should replace the binaries rather
          # than fail, so a failed build can simply be retried.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Kairo $TAG" \
              --generate-notes
          fi
