<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kairo pose sheet</title>
    <style>
      body {
        margin: 0;
        padding: 14px;
        background: #cfd8de;
        font: 11px/1.3 system-ui, sans-serif;
        color: #2f3a44;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        font-weight: 700;
        padding-bottom: 2px;
      }
      canvas {
        display: block;
        background:
          repeating-conic-gradient(#e9eef1 0 25%, #dae2e7 0 50%) 0 0 / 16px 16px;
        image-rendering: pixelated;
        outline: 1px solid rgb(47 58 68 / 25%);
      }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script type="module">
      import {
        SPRITE_DATA,
        SPRITE_WIDTH,
        SPRITE_HEIGHT,
        CAT_TOP,
        paintPose
      } from "./src/cat-sprite.mjs";

      const { POSES } = SPRITE_DATA;
      const grid = document.querySelector("#grid");
      const zoom = 5;

      for (const name of Object.keys(POSES)) {
        const figure = document.createElement("figure");
        const caption = document.createElement("figcaption");
        caption.textContent = name;
        const canvas = document.createElement("canvas");
        canvas.width = SPRITE_WIDTH;
        canvas.height = SPRITE_HEIGHT;
        canvas.style.width = `${SPRITE_WIDTH * zoom}px`;
        canvas.style.height = `${SPRITE_HEIGHT * zoom}px`;
        paintPose(canvas.getContext("2d"), name, CAT_TOP);
        figure.append(caption, canvas);
        grid.append(figure);
      }
    </script>
  </body>
</html>
